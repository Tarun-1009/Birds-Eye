<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="ambient-glow" cx="50%" cy="30%" r="70%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="subtle-accent" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="subtle-accent-right" cx="80%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0"/>
    </radialGradient>
    <pattern id="clean-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
    <pattern id="major-grid" width="192" height="192" patternUnits="userSpaceOnUse">
      <path d="M 192 0 L 0 0 0 192" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.1)"/>
      <circle cx="192" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.1)"/>
      <circle cx="0" cy="192" r="1.5" fill="rgba(255, 255, 255, 0.1)"/>
      <circle cx="192" cy="192" r="1.5" fill="rgba(255, 255, 255, 0.1)"/>
    </pattern>
  </defs>

  <!-- Deep Slate Ambient Background -->
  <rect width="100%" height="100%" fill="#070a13"/>
  <rect width="100%" height="100%" fill="url(#ambient-glow)"/>
  <rect width="100%" height="100%" fill="url(#subtle-accent)"/>
  <rect width="100%" height="100%" fill="url(#subtle-accent-right)"/>

  <!-- Precision Grids -->
  <rect width="100%" height="100%" fill="url(#clean-grid)"/>
  <rect width="100%" height="100%" fill="url(#major-grid)"/>

  <!-- Minimal Blueprint Horizon Lines -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="1920" y2="80"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>
</svg>
